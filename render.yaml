services:
  - type: web
    name: nightprobe-backend
    runtime: python
    rootDir: mysite
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn mysite.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mysite.settings
      - key: PYTHON_VERSION
        value: 3.11.0
